name: App Store metadata

# Загружает тексты и скриншоты версии 1.0 в App Store Connect без отправки на проверку.
# Только вручную. Бинарь не трогает.
on:
  workflow_dispatch:

jobs:
  deliver:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Upload metadata (no submission)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: fastlane ios upload_metadata
